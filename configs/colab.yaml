profile: colab

seed: 42
seeds: [42, 43, 44]

data:
  dataset_name: imdb
  initial_labeled_size: 100
  pool_size: 2000
  validation_size: 500
  test_size: 1000
  max_text_length: 512

model:
  name: distilbert-base-uncased
  num_labels: 2
  max_length: 256

train:
  epochs: 2
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01

active_learning:
  budget: 200
  query_batch_size: 20
  uncertainty: entropy
  silver_threshold: 0.85
  silver_weight: 0.5

llm:
  mode: api
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60
  max_retries: 3
  shot_mode: zero
  prompt_version: v1
  replay_path: null

paths:
  output_dir: /content/outputs/colab
  cache_dir: /content/outputs/cache
  drive_output_dir: null
