profile: paper_al_silver
seed: 42
seeds:
- 42
- 43
- 44
- 45
- 46
experiment:
  methods:
  - baseline
  - uncertainty_gold
  - random_silver
  - proposed
  - llm_distill
  - llm_zeroshot
data:
  dataset_name: imdb
  initial_labeled_size: 500
  pool_size: 20000
  validation_size: 2000
  test_size: 25000
  max_text_length: 5000
model:
  name: roberta-base
  num_labels: 2
  max_length: 512
train:
  epochs: 3
  batch_size: 4
  learning_rate: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
active_learning:
  budget: 1000
  query_batch_size: 1000
  uncertainty: entropy
  silver_threshold: 0.8
  silver_weight: 0.8
  post_budget_silver: 8000
distill:
  size: null
  include_initial_gold: false
cost:
  human_per_label_usd: 0.1
  llm_price_per_million_input: null
  llm_price_per_million_output: null
llm:
  mode: api
  provider: openai_compatible
  base_url: https://openrouter.ai/api/v1
  model: deepseek/deepseek-v4-flash-0731
  api_key_env: OPENROUTER_API_KEY
  timeout_seconds: 90
  max_retries: 4
  concurrency: 8
  shot_mode: zero
  prompt_version: v2
  reasoning: 'off'
  json_mode: true
  max_tokens: 512
  seed: 42
  extra_body: null
  replay_path: null
bakeoff:
  output_dir: outputs/paper_bakeoff
  final_config: configs/paper_al_final.yaml
  n_probe_samples: 200
  llm_candidates:
  - mistralai/ministral-3b-2512
  - qwen/qwen3.5-9b
  - qwen/qwen3.5-35b-a3b
  - qwen/qwen3.6-27b
  - google/gemma-4-31b-it
  - deepseek/deepseek-v4-flash-0731
  - openai/gpt-4o-mini
  - deepseek/deepseek-v3.2
  - deepseek/deepseek-v4-pro-0813
  - qwen/qwen3.7-plus
  - openai/gpt-4o
  - x-ai/grok-4.3
paths:
  output_dir: outputs/paper_al_silver
  cache_dir: outputs/cache
  docs_figures_dir: paper-figures
notes: 'LLM = deepseek/deepseek-v4-flash-0731: cheapest model statistically tied with the probe winner qwen/qwen3.7-plus (McNemar p=0.625, probe run 2026-11-23_1803); chosen for the cost-reduction goal and the $10 API budget.'
