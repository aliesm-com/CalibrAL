# LLM backend: local Ollama (OpenAI-compatible)
# Start Ollama first, e.g.: ollama serve && ollama pull llama3.1
profile: llm_local_ollama
seed: 42
seeds: [42]

data:
  dataset_name: imdb
  initial_labeled_size: 100
  pool_size: 2000
  validation_size: 500
  test_size: 1000
  max_text_length: 512

model:
  name: distilbert-base-uncased
  num_labels: 2
  max_length: 256

train:
  epochs: 2
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01

active_learning:
  budget: 200
  query_batch_size: 20
  uncertainty: entropy
  silver_threshold: 0.85
  silver_weight: 0.5

llm:
  mode: api
  provider: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  model: llama3.1
  api_key_env: LOCAL_API_KEY
  timeout_seconds: 120
  max_retries: 2
  shot_mode: zero
  prompt_version: v1
  replay_path: null

paths:
  output_dir: outputs/llm/local_ollama
  cache_dir: outputs/cache
